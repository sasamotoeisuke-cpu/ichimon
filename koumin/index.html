<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>公民 一問一答</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* Layout: one narrow column like a study notebook; unit list → quiz card → result. Highlighter marks "past mistakes". */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #1b2331;
  --muted: #5b6577;
  --line: #dbe1ea;
  --accent: #2c4a8c;
  --accent-ink: #ffffff;
  --accent-weak: #e5ebf7;
  --marker: #fff27a;
  --marker-ink: #4a3d00;
  --ok: #1d8656;
  --ok-weak: #e2f4ea;
  --ng: #c33f37;
  --ng-weak: #fbe7e5;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151d; --surface: #1a202b; --ink: #e8ecf3; --muted: #9ba5b6; --line: #2c3444;
    --accent: #8eaaf0; --accent-ink: #0f1626; --accent-weak: #222f4c;
    --marker: #6a5d10; --marker-ink: #fff3a6;
    --ok: #52c792; --ok-weak: #163628; --ng: #ff7d73; --ng-weak: #3d1e1c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151d; --surface: #1a202b; --ink: #e8ecf3; --muted: #9ba5b6; --line: #2c3444;
  --accent: #8eaaf0; --accent-ink: #0f1626; --accent-weak: #222f4c;
  --marker: #6a5d10; --marker-ink: #fff3a6;
  --ok: #52c792; --ok-weak: #163628; --ng: #ff7d73; --ng-weak: #3d1e1c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.35; }
h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: .02em; }
h2 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); font-size: .875rem; }
.num { font-variant-numeric: tabular-nums; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.mark { background: linear-gradient(transparent 52%, var(--marker) 52%); color: var(--ink); padding: 0 .15em; }

/* header */
.top { display: flex; flex-direction: column; gap: 6px; }
.presents { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.presents-name { font-size: .95rem; font-weight: 800; color: var(--text, inherit); letter-spacing: .04em; }
.presents-word { font-size: .8rem; font-style: italic; color: var(--muted); letter-spacing: .06em; }
.eyebrow { font-size: .75rem; letter-spacing: .12em; color: var(--accent); font-weight: 700; }

/* tabs */
.tabs[hidden] { display: none; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 5px; }
.tab { border: 0; background: transparent; padding: 10px 8px; border-radius: 8px; font-weight: 700; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

/* overall */
.overall { display: flex; align-items: center; gap: 16px; }
.ring { width: 76px; height: 76px; flex: none; }
.ring text { fill: var(--ink); font-family: var(--font-display); font-weight: 900; }
.overall-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

/* unit list */
.units { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.unit { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 14px 16px; }
.unit:first-child { border-top: 0; }
.unit:hover { background: var(--accent-weak); }
.unit-name { min-width: 0; display: flex; flex-direction: column; }
.unit-label { font-size: .75rem; color: var(--accent); font-weight: 700; letter-spacing: .06em; }
.unit-title { font-weight: 700; line-height: 1.45; }
.unit-pct { font-family: var(--font-display); font-weight: 900; font-size: 1.35rem; text-align: right; }
.unit-pct small { font-size: .75rem; font-weight: 700; margin-left: 1px; }
.unit-meta { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.unit-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--muted); }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field-label { font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 14px; font-weight: 500; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-weak); color: var(--accent); font-weight: 700; }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.seg small { display: block; font-size: .72rem; color: var(--muted); font-weight: 400; }

.btn { border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 700; background: var(--accent); color: var(--accent-ink); font-size: 1rem; }
.btn.sub { background: var(--accent-weak); color: var(--accent); }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row > .btn { flex: 1 1 160px; }
.back { align-self: flex-start; border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 4px 0; }

/* quiz */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.qright { display: flex; align-items: center; gap: 12px; }
.sound { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 3px 12px; font-size: .78rem; font-weight: 700; }
.sound[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-weak); }
.progress { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.badge { font-size: .78rem; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.badge.wrong { background: var(--marker); color: var(--marker-ink); border-color: transparent; }
.hist { display: inline-flex; gap: 3px; font-size: .78rem; color: var(--muted); align-items: center; }
.hist i { font-style: normal; width: 1.35em; height: 1.35em; display: inline-grid; place-items: center; border-radius: 50%; font-size: .72rem; font-weight: 700; }
.hist i.o { background: var(--ok-weak); color: var(--ok); }
.hist i.x { background: var(--ng-weak); color: var(--ng); }
.qtext { font-size: 1.15rem; font-weight: 700; line-height: 1.65; }
.qno { color: var(--accent); font-family: var(--font-display); margin-right: .4em; }

.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { display: grid; grid-template-columns: 2em 1fr; gap: 10px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; min-height: 52px; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice .k { width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; background: var(--bg); font-weight: 700; font-size: .85rem; color: var(--muted); }
.choice span:last-child { min-width: 0; }
.choice:disabled { cursor: default; }
.choice.ok { border-color: var(--ok); background: var(--ok-weak); }
.choice.ok .k { background: var(--ok); color: var(--surface); }
.choice.ng { border-color: var(--ng); background: var(--ng-weak); }
.choice.ng .k { background: var(--ng); color: var(--surface); }

.answer-form { display: flex; flex-direction: column; gap: 10px; }
.answer-input { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 14px; background: var(--bg); font-size: 1.1rem; }
.answer-input:focus { border-color: var(--accent); outline: none; }
.note { font-size: .8rem; color: var(--muted); }

.feedback { border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.feedback.ok { background: var(--ok-weak); }
.feedback.ng { background: var(--ng-weak); }
.verdict { font-family: var(--font-display); font-weight: 900; font-size: 1.2rem; }
.feedback.ok .verdict { color: var(--ok); }
.feedback.ng .verdict { color: var(--ng); }
.feedback .ans { font-weight: 700; }

.fb-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.fb-sub { font-size: .8rem; color: var(--muted); }

/* quiz screen: compact so question, choices, judgment and next fit on one phone screen */
body.quizmode { padding-block: 8px 96px; }
.quizmode .wrap { gap: 8px; }
.quizmode .back { padding: 2px 0; font-size: .9rem; }
.quizmode .qcard { padding: 12px 14px; gap: 8px; border-radius: 14px; }
.quizmode .badges { gap: 6px; }
.quizmode .badge { font-size: .72rem; padding: 1px 8px; }
.quizmode .hist { font-size: .72rem; }
.quizmode .qtext { font-size: 1rem; line-height: 1.55; }
.quizmode .choices { gap: 6px; }
.quizmode .choice { min-height: 42px; padding: 7px 12px; gap: 8px; grid-template-columns: 1.7em 1fr; border-radius: 10px; line-height: 1.45; font-size: .95rem; }
.quizmode .choice .k { width: 1.7em; height: 1.7em; font-size: .78rem; }
.quizmode .answer-form { gap: 8px; }
.quizmode .answer-input { padding: 10px 12px; font-size: 1.05rem; }
.quizmode .row .btn { padding: 10px 14px; }
.quizmode .feedback { padding: 8px 12px; gap: 2px; border-radius: 10px; }
.quizmode .verdict { font-size: 1.05rem; }
.quizmode .feedback .ans { font-size: .95rem; }
.nextbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--bg); border-top: 1px solid var(--line);
  display: flex; justify-content: center;
}
.nextbar .btn { width: 100%; max-width: 640px; padding: 12px 18px; }

/* result */
.score { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); }
.score b { font-size: 3rem; font-weight: 900; line-height: 1; }
.score span { font-size: 1.1rem; color: var(--muted); font-weight: 700; }
.memline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.memline b { font-family: var(--font-display); font-size: 1.4rem; }
.rlist { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.ritem { display: grid; grid-template-columns: 1.6em 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ritem .m { font-weight: 900; font-family: var(--font-display); }
.ritem .m.o { color: var(--ok); }
.ritem .m.x { color: var(--ng); }
.ritem div { min-width: 0; }
.ritem .rq { font-size: .9rem; }
.ritem .ra { font-size: .85rem; color: var(--muted); }

/* titles */
.title-now, .promo-to, .title-strip, .titles li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.title-now { font-family: var(--font-display); font-weight: 900; font-size: 1.15rem; margin-top: 2px; }
.lv { font-family: var(--font-display); font-size: .72rem; font-weight: 900; letter-spacing: .04em; color: var(--accent); background: var(--accent-weak); border-radius: 6px; padding: 1px 7px; }
.tname { font-family: var(--font-display); font-weight: 900; }
.tname rt { font-family: var(--font-body); font-weight: 500; font-size: .5em; color: var(--muted); }
.gem { width: 14px; height: 14px; flex: none; transform: rotate(45deg); border-radius: 3px; background: linear-gradient(135deg, rgba(255,255,255,.75), transparent 55%), var(--gem); box-shadow: 0 0 0 1px var(--line), 0 0 8px color-mix(in srgb, var(--gem) 55%, transparent); }
.wand { color: var(--accent); font-size: .95rem; line-height: 1; }
.need { font-family: var(--font-display); font-size: 1.1rem; color: var(--accent); margin: 0 2px; }
.titles { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
.titles summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.titles ol { list-style: none; margin: 10px 0; padding: 0; display: flex; flex-direction: column; }
.titles li { padding: 7px 0; border-top: 1px solid var(--line); color: var(--muted); }
.titles li .tname { color: var(--muted); font-weight: 700; }
.titles li.got .tname { color: var(--ink); }
.titles li.now { background: var(--accent-weak); margin: 0 -8px; padding-inline: 8px; border-radius: 8px; }
.titles li:not(.got) .gem, .titles li:not(.got) .wand { opacity: .35; }
.tmin { margin-left: auto; font-size: .8rem; }
.title-strip { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
.title-strip .muted { margin-left: auto; }
.promote { background: var(--surface); border: 2px solid var(--accent); border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; animation: pop .5s ease-out; }
.promote .promo-to { justify-content: center; font-size: 1.5rem; }
.promote .gem { width: 20px; height: 20px; }
.promo-head { font-family: var(--font-display); font-weight: 900; font-size: 1.7rem; color: var(--accent); letter-spacing: .1em; }
.promo-from { color: var(--muted); font-size: .9rem; text-decoration: line-through; }
@keyframes pop { from { transform: scale(.94); } to { transform: scale(1); } }

.help { font-size: .82rem; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.help b { color: var(--ink); }
.reset { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.credit { margin: 28px 0 8px; text-align: center; font-size: .78rem; color: var(--muted); letter-spacing: .04em; }
.linkbtn { border: 0; background: transparent; color: var(--muted); text-decoration: underline; padding: 4px 0; font-size: .82rem; }
.danger { border: 0; border-radius: 8px; background: var(--ng); color: var(--surface); padding: 6px 12px; font-size: .82rem; font-weight: 700; }
.empty { padding: 14px 16px; background: var(--bg); border-radius: 10px; font-size: .9rem; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

<script>
const DATA = [{"id":"k2","subject":"公民","label":"第2章","title":"個人の尊重と日本国憲法","qs":[{"n":1,"q":"人間が、だれでも生まれながらに持っている権利を何というか。","a":"人権（基本的人権）","d":["主権","参政権","自然法","公共の福祉"],"co":false,"acc":["人権","基本的人権","人権（基本的人権）","人権(基本的人権)"]},{"n":2,"q":"国から不当に干渉されず、自由に考えたり行動したりするための権利をまとめて何というか。","a":"自由権","d":["社会権","平等権","参政権","請求権"],"co":false,"acc":["自由権"]},{"n":3,"q":"人間らしく豊かな生活を送るための権利で、生存権などを含む権利をまとめて何というか。","a":"社会権","d":["自由権","平等権","参政権","請求権"],"co":false,"acc":["社会権"]},{"n":4,"q":"権力者の思いのままではなく、法に基づいて政治を行うという考え方を何というか。","a":"法の支配","d":["人の支配","立憲主義","国民主権","三権分立"],"co":false,"acc":["法の支配"]},{"n":5,"q":"1946年11月3日に公布され、翌年5月3日に施行された、日本の最高法規を何というか。","a":"日本国憲法","d":["大日本帝国憲法","教育基本法","ポツダム宣言","五箇条の御誓文"],"co":false,"acc":["日本国憲法"]},{"n":6,"q":"国の政治のあり方を最終的に決める権限が国民にあるという考え方を何というか。","a":"国民主権","d":["天皇主権","法の支配","民主主義","基本的人権の尊重"],"co":false,"acc":["国民主権"]},{"n":7,"q":"生まれながらに持つ権利を、侵すことのできないものとして保障する憲法の基本原理を何というか。","a":"基本的人権の尊重","d":["国民主権","平和主義","個人の尊重","公共の福祉"],"co":false,"acc":["基本的人権の尊重"]},{"n":8,"q":"戦争を放棄し、世界の平和のために努力するという、日本国憲法の基本原理を何というか。","a":"平和主義","d":["国民主権","基本的人権の尊重","国際協調主義","非核三原則"],"co":false,"acc":["平和主義"]},{"n":9,"q":"日本の防衛のためにアメリカと結び、アメリカ軍の日本駐留の根拠となっている条約を何というか。","a":"日米安全保障条約（日米安保条約）","d":["サンフランシスコ平和条約","日米修好通商条約","日米和親条約","日米地位協定"],"co":false,"acc":["日米安全保障条約","日米安保条約","日米安全保障条約（日米安保条約）","日米安全保障条約(日米安保条約)"]},{"n":10,"q":"核兵器を「持たず、作らず、持ちこませず」とする、日本の基本方針を何というか。","a":"非核三原則","d":["専守防衛","核拡散防止条約","集団的自衛権","文民統制"],"co":false,"acc":["非核三原則"]},{"n":11,"q":"一人一人の個性を大切にし、かけがえのない一人の人間として扱うという考え方を何というか。","a":"個人の尊重","d":["法の下の平等","公共の福祉","国民主権","自己決定権"],"co":false,"acc":["個人の尊重"]},{"n":12,"q":"憲法第14条が定める、人種・信条・性別などを理由に差別されないという原則を何というか。","a":"法の下の平等","d":["個人の尊重","法の支配","公共の福祉","両性の本質的平等"],"co":false,"acc":["法の下の平等","法のもとの平等"]},{"n":13,"q":"1989年に国連で採択された、子どもの成長や人権を保障する条約を何というか。","a":"子ども（児童）の権利条約","d":["女子差別撤廃条約","国際人権規約","障害者権利条約","人種差別撤廃条約"],"co":false,"acc":["子ども（児童）の権利条約","子ども(児童)の権利条約","子どもの権利条約","児童の権利条約"]},{"n":14,"q":"人種や性別、身分などによって差別されず、だれもが平等な扱いを受 const KEY = 'ichimon-rec-koumin-v1';
const PREF = 'ichimon-pref-v1-koumin';

let rec = {};
try { rec = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { rec = {}; }
let pref = { subject: '公民', mode: 'choice', filter: 'all', count: 10, sound: true };
try { Object.assign(pref, JSON.parse(localStorage.getItem(PREF) || '{}')); } catch (e) {}
pref.subject = '公民';
function save() { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch (e) {} }
function savePref() { try { localStorage.setItem(PREF, JSON.stringify(pref)); } catch (e) {} }

const qid = (u, q) => u.id + '-' + q.n;
const R = id => rec[id] || { h: [], w: 0, m: false };
const mastered = id => { const h = R(id).h; return h.length >= 2 && h[h.length - 1] && h[h.length - 2]; };
function unitStats(u) {
  let m = 0, wrong = 0, tried = 0;
  u.qs.forEach(q => { const id = qid(u, q); if (mastered(id)) m++; if (R(id).m) wrong++; if (R(id).h.length) tried++; });
  return { m, wrong, tried, total: u.qs.length, pct: Math.round(m / u.qs.length * 100) };
}
function record(id, ok) {
  const r = R(id);
  r.h = r.h.concat([ok]).slice(-3);
  if (!ok) { r.w = (r.w || 0) + 1; r.m = true; }
  rec[id] = r;
  if (mastered(id)) r.m = false;
  save();
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function norm(s) {
  return String(s).normalize('NFKC').toLowerCase()
    .replace(/[\s=・･、,，\/「」『』。]/g, '')
    .replace(/[−–]/g, '-')
    .replace(/^約/, '');
}
const TITLES = [
  ['見習い魔法使い', 0], ['初級魔法使い', 5], ['中級魔法使い', 10], ['上級魔法使い', 15],
  ['魔導士', 20], ['大魔導士', 25], ['賢者', 30], ['大賢者', 35],
  ['水晶賢者', 40, '#dbe4ee', 'すいしょう'], ['柘榴石賢者', 45, '#8e1b2b', 'ざくろいし'], ['紫水晶賢者', 50, '#8a5cc2', 'むらさきすいしょう'],
  ['橄欖石賢者', 55, '#8fbf3a', 'かんらんせき'], ['藍玉賢者', 60, '#6fc3d9', 'らんぎょく'], ['黄玉賢者', 65, '#e8a93a', 'おうぎょく'],
  ['猫目石賢者', 70, '#c7a64a', 'ねこめいし'], ['翡翠賢者', 75, '#3f9a6b', 'ひすい'], ['青玉賢者', 80, '#2350b8', 'せいぎょく'],
  ['翠玉賢者', 85, '#1c8a5a', 'すいぎょく'], ['紅玉賢者', 90, '#c4123a', 'こうぎょく'], ['金剛石賢者', 100, '#ffffff', 'こんごうせき']
].map((t, i) => ({ lv: i + 1, name: t[0], min: t[1], gem: t[2] || '', read: t[3] || '' }));
function titleOf(m, total) {
  const pct = m / total * 100; let cur = TITLES[0];
  TITLES.forEach(t => { if (pct >= t.min) cur = t; });
  const nx = TITLES[cur.lv] || null;
  const need = nx ? Math.max(1, Math.ceil(nx.min / 100 * total - 1e-9) - m) : 0;
  return { cur, nx, need };
}
function subjectStats(subject) {
  let m = 0, t = 0, w = 0;
  DATA.filter(u => u.subject === subject).forEach(u => { const s = unitStats(u); m += s.m; t += s.total; w += s.wrong; });
  return { m, t, w, pct: Math.round(m / t * 100), title: titleOf(m, t) };
}
const gemDot = t => t.gem ? `<span class="gem" style="--gem:${t.gem}" aria-hidden="true"></span>` : `<span class="wand" aria-hidden="true">✦</span>`;
const titleName = t => t.read ? `<ruby>${esc(t.name.replace('賢者', ''))}<rt>${t.read}</rt></ruby>賢者` : esc(t.name);

let actx = null;
function audio() {
  try {
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}
function tone(c, freq, t, dur, vol, type) {
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function playOk() { // ピンポン：高い音→少し低い音
  const c = audio(); if (!c) return; const t = c.currentTime + 0.01;
  tone(c, 1318.5, t, 0.32, 0.32); tone(c, 2637, t, 0.18, 0.05);
  tone(c, 1046.5, t + 0.17, 0.6, 0.32); tone(c, 2093, t + 0.17, 0.3, 0.05);
}
function playNg() { // ポヨン：下がりながら揺れる音
  const c = audio(); if (!c) return; const t = c.currentTime + 0.01;
  const o = c.createOscillator(), g = c.createGain(), l = c.createOscillator(), lg = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(300, t);
  o.frequency.exponentialRampToValueAtTime(170, t + 0.12);
  o.frequency.exponentialRampToValueAtTime(130, t + 0.55);
  l.frequency.setValueAtTime(11, t); lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(28, t + 0.15);
  l.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.45, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
  o.connect(g); g.connect(c.destination);
  o.start(t); l.start(t); o.stop(t + 0.65); l.stop(t + 0.65);
}
function playFanfare() { // 昇格のファンファーレ
  const c = audio(); if (!c) return; const t = c.currentTime + 0.02;
  [[523.25, 0], [659.25, .12], [783.99, .24]].forEach(([f, d]) => { tone(c, f, t + d, .2, .22, 'triangle'); });
  tone(c, 783.99, t + .4, .14, .2, 'triangle'); tone(c, 1046.5, t + .54, 1.1, .26, 'triangle');
  [659.25, 783.99, 523.25].forEach(f => tone(c, f, t + .54, 1.1, .1, 'sine'));
  tone(c, 2093, t + .54, .6, .04, 'sine');
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let view = 'home', unit = null, quiz = null, confirmReset = false;
const app = document.getElementById('app');

function ring(pct) {
  const r = 32, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
  return `<svg class="ring" viewBox="0 0 76 76" role="img" aria-label="記憶度 ${pct}%">
    <circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/>
    <circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 38 38)"/>
    <text x="38" y="44" text-anchor="middle" font-size="18">${pct}%</text></svg>`;
}

  app.innerHTML = `

    </div>
    <section class="overall">
      ${ring(pct)}
      <div class="overall-text">
        <h2>${esc(pref.subject)}の記憶度</h2>
        <p class="title-now"><span class="lv num">Lv.${ti.cur.lv}</span>${gemDot(ti.cur)}<span class="tname">${titleName(ti.cur)}</span></p>
        <p class="muted num">${ti.nx ? `次の称号まで あと<b class="need">${ti.need}</b>問` : '最高位に到達しました'}</p>
        <p class="muted num">覚えた問題 ${m} / ${t}問　${w ? `<span class="mark">過去に間違えた問題 ${w}問</span>` : ''}</p>
      </div>
    </section>
    <section class="units" aria-label="単元">
      ${units.map(u => { const s = unitStats(u); return `
        <button class="unit" data-unit="${u.id}">
          <span class="unit-name"><span class="unit-label">${esc(u.label)}</span><span class="unit-title">${esc(u.title)}</span></span>
          <span class="unit-pct num">${s.pct}<small>%</small></span>
          <span class="unit-meta">
            <span class="bar"><span style="width:${s.pct}%"></span></span>
            <span class="unit-stats num"><span>全${s.total}問</span><span>覚えた ${s.m}</span>${s.wrong ? `<span class="mark">過去に間違えた ${s.wrong}</span>` : ''}${s.tried ? '' : '<span>未学習</span>'}</span>
          </span>
        </button>`; }).join('')}
    </section>
    <section class="help">
      <p><b>記憶度とは</b>　2回続けて正解した問題を「覚えた」とし、単元の全問題のうち「覚えた」問題の割合を表しています。</p>
      <p><b>称号</b>　2回続けて正解した問題の割合（記憶度）で称号が上がります。称号は科目ごとです。</p>
      <p><b>過去に間違えた問題</b>　間違えると黄色の印が付き、2回続けて正解すると印が外れます。</p>
      <p>学習の記録はこの端末のこのブラウザに保存されます。別の端末やブラウザでは引き継がれません。</p>
      <div class="reset">${confirmReset
        ? `<span>すべての記録を消しますか？</span><button class="danger" id="doReset">消す</button><button class="linkbtn" id="cancelReset">やめる</button>`
        : `<button class="linkbtn" id="askReset">学習の記録をすべて消す</button>`}</div>
      <p class="credit">© みらい塾ポケット狭山台</p>
    </section>`;
  app.querySelectorAll('[data-subject]').forEach(b => b.onclick = () => { pref.subject = b.dataset.subject; savePref(); renderHome(); });
  app.querySelectorAll('[data-unit]').forEach(b => b.onclick = () => { unit = DATA.find(u => u.id === b.dataset.unit); view = 'setup'; render(); });
  const a = document.getElementById('askReset'); if (a) a.onclick = () => { confirmReset = true; renderHome(); };
  const c = document.getElementById('cancelReset'); if (c) c.onclick = () => { confirmReset = false; renderHome(); };
  const d = document.getElementById('doReset'); if (d) d.onclick = () => { rec = {}; save(); confirmReset = false; renderHome(); };
}

function pool(u, filter) {
  return u.qs.filter(q => {
    const id = qid(u, q);
    if (filter === 'wrong') return R(id).m;
    if (filter === 'unlearned') return !mastered(id);
    return true;
  });
}

function renderSetup() {
  const s = unitStats(unit);
  const counts = { all: unit.qs.length, wrong: pool(unit, 'wrong').length, unlearned: pool(unit, 'unlearned').length };
  if (!counts[pref.filter]) pref.filter = 'all';
  const coN = unit.qs.filter(q => q.co).length;
  app.innerHTML = `
    <button class="back" id="back">← 単元一覧</button>
    <header class="top">
      <span class="eyebrow">${esc(unit.subject)}　${esc(unit.label)}</span>
      <h1>${esc(unit.title)}</h1>
    </header>
    <section class="overall">
      ${ring(s.pct)}
      <div class="overall-text">
        <h2>この単元の記憶度</h2>
        <p class="muted num">覚えた ${s.m} / ${s.total}問　${s.wrong ? `<span class="mark">過去に間違えた ${s.wrong}問</span>` : ''}</p>
      </div>
    </section>
    <section class="panel">
      <div class="field">
        <span class="field-label">解答のしかた</span>
        <div class="seg">
          <button data-mode="choice" aria-pressed="${pref.mode === 'choice'}">5択で答える</button>
          <button data-mode="input" aria-pressed="${pref.mode === 'input'}">入力して答える</button>
        </div>
        ${pref.mode === 'input' && coN ? `<p class="note">文章や順番で答える問題（${coN}問）は5択で出題します。</p>` : ''}
      </div>
      <div class="field">
        <span class="field-label">出題する問題</span>
        <div class="seg">
          <button data-filter="all" aria-pressed="${pref.filter === 'all'}">すべて<small>${counts.all}問</small></button>
          <button data-filter="unlearned" aria-pressed="${pref.filter === 'unlearned'}" ${counts.unlearned ? '' : 'disabled'}>まだ覚えていない<small>${counts.unlearned}問</small></button>
          <button data-filter="wrong" aria-pressed="${pref.filter === 'wrong'}" ${counts.wrong ? '' : 'disabled'}>過去に間違えた<small>${counts.wrong}問</small></button>
        </div>
      </div>
      <div class="field">
        <span class="field-label">問題数</span>
        <div class="seg">
          ${[10, 20, 0].map(n => `<button data-count="${n}" aria-pressed="${pref.count === n}">${n ? n + '問' : '全部'}</button>`).join('')}
        </div>
      </div>
      <button class="btn" id="start">はじめる</button>
    </section>`;
  document.getElementById('back').onclick = () => { view = 'home'; render(); };
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { pref.mode = b.dataset.mode; savePref(); renderSetup(); });
  app.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { pref.filter = b.dataset.filter; savePref(); renderSetup(); });
  app.querySelectorAll('[data-count]').forEach(b => b.onclick = () => { pref.count = +b.dataset.count; savePref(); renderSetup(); });
  document.getElementById('start').onclick = () => startQuiz(pool(unit, pref.filter));
}

function startQuiz(qs) {
  let list = shuffle(qs);
  if (pref.count) list = list.slice(0, pref.count);
  const memBefore = unitStats(unit).pct;
  const lvBefore = subjectStats(unit.subject).title.cur.lv;
  quiz = {
    lvBefore,
    items: list.map(q => ({ q, kind: (pref.mode === 'input' && !q.co) ? 'input' : 'choice', opts: shuffle([q.a].concat(q.d)), was: { ...R(qid(unit, q)) }, done: false, ok: null, given: '' })),
    i: 0, memBefore
  };
  view = 'quiz'; render();
}

function histHtml(h) {
  if (!h || !h.length) return '<span class="hist">はじめての問題</span>';
  return `<span class="hist">直近の結果 ${h.map(x => `<i class="${x ? 'o' : 'x'}">${x ? '○' : '×'}</i>`).join('')}</span>`;
}

function renderQuiz() {
  const it = quiz.items[quiz.i], q = it.q, n = quiz.items.length;
  const was = it.was;
  let badge = '';
  if (was.m) badge = `<span class="badge wrong">過去に間違えた問題（${was.w}回）</span>`;
  else if (was.w) badge = `<span class="badge">以前に間違えたことあり</span>`;
  let body = '';
  if (it.kind === 'choice') {
    body = `<div class="choices">${it.opts.map((o, k) => {
      let cls = '';
      if (it.done) { if (o === q.a) cls = 'ok'; else if (o === it.given) cls = 'ng'; }
      return `<button class="choice ${cls}" data-opt="${k}" ${it.done ? 'disabled' : ''}><span class="k">${'ABCDE'[k]}</span><span>${esc(o)}</span></button>`;
    }).join('')}</div>`;
  } else {
    body = `<form class="answer-form" id="ansForm">
      <label class="note" for="ans">答えを入力してください</label>
      <input class="answer-input" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" ${it.done ? 'disabled' : ''} value="${esc(it.given)}">
      ${it.done ? '' : `<div class="row"><button class="btn" type="submit">答え合わせ</button><button class="btn ghost" type="button" id="giveup">わからない</button></div>`}
    </form>`;
  }
  let fb = '';
  if (it.done) {
    const showAns = it.kind === 'input' || !it.ok;
    fb = `<div class="feedback ${it.ok ? 'ok' : 'ng'}" role="status">
      <p class="fb-line"><span class="verdict">${it.ok ? '○ 正解' : '× 不正解'}</span>${showAns ? `<span>正答：<span class="ans">${esc(q.a)}</span></span>` : ''}</p>
      ${it.kind === 'input' && !it.ok ? `<span class="fb-sub">あなたの答え：${esc(it.given || '（無回答）')}</span>` : ''}
      ${!it.ok ? '<span class="fb-sub">「過去に間違えた問題」に入りました</span>' : (mastered(qid(unit, q)) && was.m ? '<span class="fb-sub">2回続けて正解したので、印が外れました</span>' : '')}
    </div>
    <div class="nextbar"><button class="btn" id="next">${quiz.i + 1 < n ? '次の問題へ' : '結果を見る'}</button></div>`;
  }
  app.innerHTML = `
    <div class="qhead"><button class="back" id="quit">← やめる</button><span class="qright"><button class="sound" id="sound" aria-pressed="${pref.sound}">${pref.sound ? '音 ON' : '音 OFF'}</button><span class="muted num">${quiz.i + 1} / ${n}</span></span></div>
    <div class="progress"><span style="width:${(quiz.i + (it.done ? 1 : 0)) / n * 100}%"></span></div>
    <article class="qcard">
      <div class="badges">${badge}${histHtml(was.h)}</div>
      <p class="qtext"><span class="qno num">No.${q.n}</span>${esc(q.q)}</p>
      ${body}
      ${fb}
    </article>`;
  document.getElementById('quit').onclick = () => { view = 'setup'; render(); };
  document.getElementById('sound').onclick = () => { pref.sound = !pref.sound; savePref(); const b = document.getElementById('sound'); b.setAttribute('aria-pressed', pref.sound); b.textContent = pref.sound ? '音 ON' : '音 OFF'; };
  app.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => answer(it.opts[+b.dataset.opt], it.opts[+b.dataset.opt] === q.a));
  const f = document.getElementById('ansForm');
  if (f && !it.done) {
    f.onsubmit = e => { e.preventDefault(); const v = document.getElementById('ans').value; if (!v.trim()) return; answer(v, q.acc.some(a => norm(a) === norm(v))); };
    document.getElementById('giveup').onclick = () => answer('', false);
    setTimeout(() => { const el = document.getElementById('ans'); if (el) el.focus(); }, 0);
  }
  const nx = document.getElementById('next');
  if (nx) { nx.onclick = next; setTimeout(() => nx.focus(), 0); }
}

function answer(given, ok) {
  const it = quiz.items[quiz.i];
  if (it.done) return;
  it.done = true; it.ok = ok; it.given = given;
  if (pref.sound) { try { ok ? playOk() : playNg(); } catch (e) {} }
  record(qid(unit, it.q), ok);
  renderQuiz();
}
function next() {
  if (quiz.i + 1 < quiz.items.length) { quiz.i++; renderQuiz(); window.scrollTo(0, 0); }
  else { view = 'result'; render(); }
}

function renderResult() {
  const its = quiz.items, okN = its.filter(i => i.ok).length;
  const s = unitStats(unit);
  const wrongs = its.filter(i => !i.ok).map(i => i.q);
  const sj = subjectStats(unit.subject), ti = sj.title;
  const up = ti.cur.lv > quiz.lvBefore && !quiz.celebrated;
  const prev = TITLES[quiz.lvBefore - 1];
  app.innerHTML = `
    <header class="top">
      <span class="eyebrow">${esc(unit.subject)}　${esc(unit.label)}　${esc(unit.title)}</span>
      <h1>結果</h1>
    </header>
    ${ti.cur.lv > quiz.lvBefore ? `<section class="promote" role="status">
      <span class="promo-head">昇格！</span>
      <p class="promo-from">${esc(prev.name)}</p>
      <p class="promo-to"><span class="lv num">Lv.${ti.cur.lv}</span>${gemDot(ti.cur)}<span class="tname">${titleName(ti.cur)}</span></p>
      <p class="muted num">${ti.nx ? `次の称号まで あと${ti.need}問` : '最高位に到達しました'}</p>
    </section>` : `<section class="title-strip"><span class="lv num">Lv.${ti.cur.lv}</span>${gemDot(ti.cur)}<span class="tname">${titleName(ti.cur)}</span><span class="muted num">${ti.nx ? `次の称号まで あと${ti.need}問` : '最高位'}</span></section>`}
    <section class="panel">
      <div class="score num"><b>${okN}</b><span>/ ${its.length}問 正解</span></div>
      <div class="memline num"><span class="muted">この単元の記憶度</span><span>${quiz.memBefore}%</span><span class="muted">→</span><b>${s.pct}%</b></div>
      <div class="row">
        ${wrongs.length ? `<button class="btn" id="retryWrong">今回間違えた${wrongs.length}問をもう一度</button>` : ''}
        <button class="btn sub" id="again">同じ設定でもう一度</button>
      </div>
      <button class="btn ghost" id="home">単元一覧へ</button>
    </section>
    <section class="panel">
      <h2>解いた問題</h2>
      <div class="rlist">${its.map(i => `
        <div class="ritem"><span class="m ${i.ok ? 'o' : 'x'}">${i.ok ? '○' : '×'}</span>
          <div><p class="rq"><span class="num">No.${i.q.n}</span>　${esc(i.q.q)}</p><p class="ra">正答：${esc(i.q.a)}${!i.ok && i.kind === 'input' ? `　／　あなたの答え：${esc(i.given || '（無回答）')}` : ''}</p></div>
        </div>`).join('')}</div>
    </section>`;
  if (up) { quiz.celebrated = true; if (pref.sound) { try { playFanfare(); } catch (e) {} } }
  const rw = document.getElementById('retryWrong');
  if (rw) rw.onclick = () => { const c = pref.count; pref.count = 0; startQuiz(wrongs); pref.count = c; };
  document.getElementById('again').onclick = () => { const p = pool(unit, pref.filter); startQuiz(p.length ? p : unit.qs); };
  document.getElementById('home').onclick = () => { view = 'home'; render(); };
}

function render() {
  document.body.classList.toggle('quizmode', view === 'quiz');
  if (view === 'home') renderHome();
  else if (view === 'setup') renderSetup();
  else if (view === 'quiz') renderQuiz();
  else renderResult();
  if (view !== 'quiz') window.scrollTo(0, 0);
}
render();
</script>

</body>
</html>
